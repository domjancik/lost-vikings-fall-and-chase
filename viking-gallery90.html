<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vikings · movement study 90</title>
<style>body{background:#17202a;color:#e7ddc5;font:16px system-ui;margin:24px}button,select,input{font:inherit;background:#283443;color:inherit;padding:8px;border:1px solid #69727b;border-radius:4px}nav{display:flex;gap:12px;flex-wrap:wrap;align-items:center}canvas{image-rendering:pixelated;max-width:100%;height:auto}a{color:#dcc18a}#status{max-width:760px;line-height:1.6}</style>
<h1>Vikings · movement study</h1><p>Corrected walk and ladder poses. Other actions retain their previous complete artwork.</p>
<nav><label>Viking <select id="hero"><option value="erik">Erik</option><option value="baleog">Baleog</option><option value="olaf">Olaf</option></select></label><label>Action <select id="action"></select></label><button id="pause">Pause</button><button id="step">Next frame</button><label><input id="mirror" type="checkbox"> Face left</label><label>Scale <select id="scale"><option value="2">1× game</option><option value="4" selected>2× game</option></select></label></nav>
<p id="status"></p><canvas id="art" width="1024" height="360"></canvas><p><a id="source" target="_blank">Original generated frame</a> · <a href="/?skin=imagegen90&amp;release=90">Play</a> · <a href="viking-gallery88.html">Previous skin</a></p>
<script type="module">
const $=id=>document.getElementById(id),cache=new Map();let data,guide,sheet,registration,frames=[],phase=0,playing=true,last=0;
const img=async path=>{if(!cache.has(path))cache.set(path,new Promise((resolve,reject)=>{const i=new Image;i.onload=()=>resolve(i);i.onerror=()=>reject(Error('Missing '+path));i.src=path;}));return cache.get(path);};
async function load(){const hero=$('hero').value;[data,registration,guide,sheet]=await Promise.all([fetch(`assets/vikings90/${hero}-guide.json`).then(r=>r.json()),fetch(`assets/vikings90/${hero}-registration.json`).then(r=>r.json()),img(`assets/vikings90/${hero}-guide-native.png`),img(`assets/vikings90/${hero}-native.png`)]);$('action').replaceChildren(...[...new Set(data.allFrames.map(f=>f.action))].map(a=>new Option(a,a)));choose();}
function choose(){frames=data.allFrames.filter(f=>f.action===$('action').value);phase=0;last=0;draw();}
async function draw(){if(!frames.length)return;const f=frames[phase],record=registration.replacementRecords.find(r=>r.cell===f.cell),ctx=$('art').getContext('2d'),scale=Number($('scale').value);ctx.imageSmoothingEnabled=false;ctx.fillStyle='#1d2a36';ctx.fillRect(0,0,1024,360);ctx.font='16px system-ui';ctx.fillStyle='#e7ddc5';const labels=['Native guide','Generated source','Game sprite'];for(let n=0;n<3;n++){const x=20+n*340;ctx.fillText(labels[n],x,24);ctx.save();ctx.translate(x+160,40);ctx.scale($('mirror').checked?-scale:scale,scale);ctx.translate(-40,0);ctx.strokeStyle='#596775';ctx.lineWidth=1/scale;ctx.beginPath();ctx.moveTo(40,0);ctx.lineTo(40,80);ctx.moveTo(0,70);ctx.lineTo(80,70);ctx.stroke();if(n===2)ctx.drawImage(sheet,f.cell%8*80,Math.floor(f.cell/8)*80,80,80,0,0,80,80);else if(record){const i=data.frames.findIndex(r=>r.cell===f.cell);if(n===0)ctx.drawImage(guide,i%8*64,Math.floor(i/8)*64,64,64,8,8,64,64);else{const src=await img(`assets/vikings90/${record.source}`);ctx.drawImage(src,8+record.translation[0],8+record.translation[1],64,64);}}ctx.restore();}const hero=$('hero').value;$('status').textContent=`${hero} · ${f.action} · phase ${f.phase+1}/${frames.length} · ${record?'Corrected whole pose; source registered by translation':'Retained previous whole pose'}`;$('source').hidden=!record;if(record)$('source').href=`assets/vikings90/${record.source}`;}
function tick(time){const speed=$('action').value.includes('walk')?110:240;if(playing&&time-last>speed){phase=(phase+1)%Math.max(1,frames.length);last=time;draw();}requestAnimationFrame(tick);}
$('hero').onchange=load;$('action').onchange=choose;$('pause').onclick=()=>{playing=!playing;$('pause').textContent=playing?'Pause':'Play';};$('step').onclick=()=>{playing=false;$('pause').textContent='Play';phase=(phase+1)%frames.length;draw();};$('mirror').onchange=draw;$('scale').onchange=draw;await load();requestAnimationFrame(tick);
</script></html>
