<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Guided Vikings · full animation review</title>
<style>body{margin:20px;background:#1c232d;color:#e8d4b3;font:16px system-ui}h1{font-size:24px}nav{display:flex;flex-wrap:wrap;gap:12px;position:sticky;top:0;background:#1c232d;padding:12px 0}button,select,input{font:inherit}main{display:flex;flex-wrap:wrap;gap:24px}.views{display:flex;flex-wrap:wrap;gap:8px}figure{margin:0}canvas{image-rendering:pixelated;background:#292f39;display:block}figcaption,small{font-size:12px}img{max-width:100%;image-rendering:pixelated}summary{cursor:pointer}</style>
<h1>Guided Imagegen Vikings · complete pose kit</h1><p>Generated material over the reviewed motion guides. Native80 cells include8 pixels of transparent padding; bodies retain36/38/36 native heights. These previews accompany the separate source and gameplay review.</p>
<nav><button id="play">Pause</button><label>Hero <select id="hero"><option value="all">All three</option><option>erik</option><option>baleog</option><option>olaf</option></select></label><label>Action <select id="action"></select></label><label>View <select id="zoom"><option value="2">1× game size</option><option value="4">2× game size</option><option value="6">Large pixel view</option></select></label><label>Speed <select id="speed"><option value="1">Normal</option><option value="0.5">Half</option><option value="0.25">Quarter</option><option value="2">Double</option></select></label><label>Phase <input id="phase" type="range" min="0" max="7" value="0"></label><span id="status"></span></nav><main id="cards"></main><h2>All130 poses and retained originals</h2><main id="sources"></main>
<script type="module">
const names=['erik','baleog','olaf'],load=src=>new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=reject;i.src=src;}),data=[];
for(const name of names){const base='assets/vikings88/',[meta,guideMeta]=await Promise.all([fetch(base+name+'-registration.json').then(r=>r.json()),fetch(base+'guides-'+name+'-frames.json').then(r=>r.json())]);const[art,guide,raw]=await Promise.all([load(base+name+'-native.png'),load(base+'guides-'+name+'.png'),load(base+meta.source)]);data.push({name,meta,guideMeta,art,guide,raw});}
const $=id=>document.getElementById(id),actions=[...new Set(data.flatMap(d=>d.guideMeta.frames.map(f=>f.action)))];for(const action of actions)$('action').add(new Option(action,action));$('action').value='walk';
let running=true,t=0,last=performance.now(),phase=0;
function canvas(parent,label,w=80,h=80){const f=document.createElement('figure'),c=document.createElement('canvas');c.width=w;c.height=h;const cap=document.createElement('figcaption');cap.textContent=label;f.append(c,cap);parent.append(f);return c;}
for(const d of data){const a=document.createElement('article');a.innerHTML='<h2>'+d.name+'</h2>';const views=document.createElement('div');views.className='views';a.append(views);d.artCanvas=canvas(views,'Final generated material');d.guideCanvas=canvas(views,'Motion guide · same body scale');d.rawCanvas=canvas(views,'Original actor · same apparent size');d.label=document.createElement('small');a.append(d.label);$('cards').append(a);d.card=a;
 const full=document.createElement('details');full.innerHTML='<summary>'+d.name+' · all '+d.guideMeta.frames.length+' native cells / original source</summary>';const atlas=document.createElement('img');atlas.src=d.art.src;const raw=document.createElement('a');raw.href=d.raw.src;raw.textContent='Open retained original generated atlas';raw.target='_blank';full.append(atlas,raw);$('sources').append(full);}
function draw(){const action=$('action').value,zoom=Number($('zoom').value);for(const d of data){d.card.hidden=$('hero').value!=='all'&&$('hero').value!==d.name;let cells=d.guideMeta.frames.map((f,i)=>({f,i})).filter(q=>q.f.action===action);if(!cells.length)cells=d.guideMeta.frames.map((f,i)=>({f,i})).filter(q=>q.f.action==='idle');const q=cells[phase%cells.length],i=q.i;d.label.textContent=q.f.action+' · phase '+q.f.phase+' · cell '+i;
 for(const c of[d.artCanvas,d.guideCanvas,d.rawCanvas]){c.style.width=c.style.height=80*zoom+'px';const g=c.getContext('2d');g.clearRect(0,0,80,80);g.imageSmoothingEnabled=false;}
 d.artCanvas.getContext('2d').drawImage(d.art,i%8*80,Math.floor(i/8)*80,80,80,0,0,80,80);d.guideCanvas.getContext('2d').drawImage(d.guide,i%8*64,Math.floor(i/8)*64,64,64,8,8,64,64);
 const r=d.meta.records[i],b=r.originalBounds,s=r.sourceAffine[0],tx=r.sourceAffine[2],ty=r.sourceAffine[5];d.rawCanvas.getContext('2d').drawImage(d.raw,b[0],b[1],b[2]-b[0],b[3]-b[1],(b[0]-tx)/s,(b[1]-ty)/s,(b[2]-b[0])/s,(b[3]-b[1])/s);}
 $('status').textContent='Phase '+phase;}
$('play').onclick=()=>{running=!running;$('play').textContent=running?'Pause':'Play';};$('phase').oninput=()=>{running=false;$('play').textContent='Play';phase=Number($('phase').value);draw();};for(const id of['hero','action'])$(id).onchange=()=>{phase=0;t=0;draw();};
function step(now){t+=(now-last)*Number($('speed').value);last=now;if(running&&t>=110){t%=110;phase++;$('phase').value=phase%8;draw();}requestAnimationFrame(step);}for(const id of['zoom','speed'])document.getElementById(id).onchange=draw;draw();requestAnimationFrame(step);
</script></html>
